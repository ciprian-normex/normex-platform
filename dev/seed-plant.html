<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seed Plant Demo Data</title></head><body><main><h1>Plant development seed</h1><p id="seedUser">Checking authenticated user…</p><button id="seedPlantData" type="button" disabled>Seed Plant Demo Data</button><pre id="seedResult"></pre></main><script src="/modules/contractor/shared/js/config.js"></script><script type="module">import {auth,db} from "/js/firebase.js";import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";import {seedPlantMaintenanceDemo} from "/dev/seed-plant-test-data.js";const q=id=>document.getElementById(id),button=q("seedPlantData"),result=q("seedResult");auth.onAuthStateChanged(async user=>{if(!user){q("seedUser").textContent="Sign in as a Platform Admin to run this development-only seed.";return;}const snapshot=await getDoc(doc(db,"users",user.uid)),p=snapshot.data();q("seedUser").textContent=`${p?.displayName||user.email} · ${p?.organisationId||"no organisation"}`;button.disabled=!(p?.status==="ACTIVE"&&p?.organisationId==="colemans"&&p?.roleCode==="PLATFORM_ADMIN"&&p?.accessLevel===99);});button.onclick=async()=>{button.disabled=true;try{const output=await seedPlantMaintenanceDemo();result.textContent=`Seed complete: ${JSON.stringify(output)}`;}catch(error){result.textContent=`Seed failed: ${error.message}`;}finally{button.disabled=false;}};</script></body></html>
